services:
  nginx:
    ports: !override
      - "127.0.0.1:${EXPOSE_NGINX_PORT:-15001}:${NGINX_PORT:-80}"
      - "127.0.0.1:${EXPOSE_NGINX_SSL_PORT:-15002}:${NGINX_SSL_PORT:-443}"

  plugin_daemon:
    ports: !override
      - "127.0.0.1:${EXPOSE_PLUGIN_DEBUGGING_PORT:-15003}:${PLUGIN_DEBUGGING_PORT:-5003}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api_websocket:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker_beat:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ssrf_proxy:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ssrf_proxy/durian-ragflow.conf:/etc/squid/conf.d/durian-ragflow.conf:ro
